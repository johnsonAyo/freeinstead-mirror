name: Deploy public catalogue mirror

on:
  workflow_dispatch:
    inputs:
      archive_sha:
        required: true
        type: string
      mirror_digest:
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Verify and unpack the public archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_SHA: ${{ inputs.archive_sha }}
          MIRROR_DIGEST: ${{ inputs.mirror_digest }}
        run: |
          [[ "$ARCHIVE_SHA" =~ ^[a-f0-9]{64}$ && "$MIRROR_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          gh release download catalogue --repo "$GITHUB_REPOSITORY" --pattern catalogue.tar.gz
          echo "$ARCHIVE_SHA  catalogue.tar.gz" | sha256sum -c
          python3 - <<'PY'
          import tarfile
          with tarfile.open('catalogue.tar.gz') as archive:
              members = archive.getmembers()
              if len(members) > 12000 or sum(item.size for item in members) > 250 * 1024**2:
                  raise ValueError('Mirror exceeds its file or size budget')
              if any(not (item.isfile() or item.isdir()) for item in members):
                  raise ValueError('Unexpected archive entry')
              archive.extractall('public', filter='data')
          PY
          test "$(jq -er .digest public/release.json)" = "$MIRROR_DIGEST"
          test -s public/index.html
          test -s public/apps/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public
          retention-days: 1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: pages
      - name: Verify the independent live URL
        env:
          PAGES_URL: ${{ steps.pages.outputs.page_url }}
          MIRROR_DIGEST: ${{ inputs.mirror_digest }}
        run: |
          for attempt in {1..24}; do
            actual="$(curl -fsS --max-time 7 "${PAGES_URL%/}/release.json?release=${MIRROR_DIGEST}" | jq -r .digest)" || actual=
            if test "$actual" = "$MIRROR_DIGEST"; then exit 0; fi
            sleep 5
          done
          exit 1
